<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Dice Simulation</title>
</head>
<body>

<h2>サイコロを60000回振る実験</h2>

<div id="result"></div>

<script>
    // 1～6の出現回数を保存する配列
    let count = [0, 0, 0, 0, 0, 0];

    // サイコロを1000回振る
    for (let i = 0; i < 10000; i++) {

        // 1～6の整数をランダムに発生
        let dice = Math.floor(Math.random() * 6) + 1;

        // 出現した目の回数を1増やす
        count[dice - 1]++;
    }

    // 結果をHTMLに表示
    let result = "";

    for (let i = 0; i < 6; i++) {
        result += (i + 1) + " → " + count[i] + "回<br>";
    }

    document.getElementById("result").innerHTML = result;
</script>

</body>
</html>
