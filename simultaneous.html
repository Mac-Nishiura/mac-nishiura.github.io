
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simultaneous Equations Solver</title>

<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 20px;
        background: #f5f7fa;
    }

    h2 {
        text-align: center;
        color: #24527a;
    }

    .equation {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin: 20px 0;
        font-size: 20px;
    }

    input {
        width: 65px;
        padding: 9px;
        font-size: 18px;
        text-align: center;
        border: 1px solid #aaa;
        border-radius: 5px;
    }

    button {
        display: block;
        margin: 25px auto;
        padding: 12px 40px;
        font-size: 18px;
        color: white;
        background: #2878b5;
        border: none;
        border-radius: 7px;
        cursor: pointer;
    }

    button:hover {
        background: #185a8e;
    }

    #result {
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        color: #176b3a;
        margin-top: 25px;
    }
</style>
</head>

<body>

<h2>Simultaneous Equations Solver</h2>

<p style="text-align:center;">
Enter the coefficients and constants.
</p>

<div class="equation">
    <input id="a" type="number" step="any" placeholder="a">
    x +
    <input id="b" type="number" step="any" placeholder="b">
    y =
    <input id="p" type="number" step="any" placeholder="p">
</div>

<div class="equation">
    <input id="c" type="number" step="any" placeholder="c">
    x +
    <input id="d" type="number" step="any" placeholder="d">
    y =
    <input id="q" type="number" step="any" placeholder="q">
</div>

<button onclick="solve()">SOLVE</button>

<div id="result"></div>

<script>
function solve() {

    const a = Number(document.getElementById("a").value);
    const b = Number(document.getElementById("b").value);
    const c = Number(document.getElementById("c").value);
    const d = Number(document.getElementById("d").value);
    const p = Number(document.getElementById("p").value);
    const q = Number(document.getElementById("q").value);

    const fields = ["a", "b", "c", "d", "p", "q"];

    if (fields.some(id =>
        document.getElementById(id).value.trim() === ""
    )) {
        document.getElementById("result").innerHTML =
            "Please enter all six values.";
        return;
    }

    // Determinant
    const D = a * d - b * c;

    const tolerance = 1e-10;

    let result = "";

    if (Math.abs(D) > tolerance) {

        // Cramer's Rule
        const x = (p * d - b * q) / D;
        const y = (a * q - p * c) / D;

        result =
            "x = " + x.toFixed(4) +
            "<br>y = " + y.toFixed(4);

    } else {

        const scale = Math.max(
            1, Math.abs(a), Math.abs(b),
            Math.abs(c), Math.abs(d),
            Math.abs(p), Math.abs(q)
        );

        const eps = tolerance * scale * scale;

        const allCoefficientsZero =
            Math.abs(a) <= tolerance &&
            Math.abs(b) <= tolerance &&
            Math.abs(c) <= tolerance &&
            Math.abs(d) <= tolerance;

        if (allCoefficientsZero) {

            if (Math.abs(p) <= tolerance &&
                Math.abs(q) <= tolerance) {
                result = "Infinitely many solutions.";
            } else {
                result = "No solution.";
            }

        } else {

            const minors = [
                a * q - c * p,
                b * q - d * p,
                p * d - b * q
            ];

            if (minors.every(v => Math.abs(v) <= eps)) {
                result = "Infinitely many solutions.";
            } else {
                result = "No solution.";
            }
        }
    }

    document.getElementById("result").innerHTML = result;
}
</script>

</body>
</html>
