
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>System of Three Linear Equations</title>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 30px;
    background: #f4f6f8;
}

.container {
    max-width: 650px;
    margin: auto;
    padding: 25px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 10px #ccc;
}

h2 {
    text-align: center;
    color: #234;
}

.equation {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 15px 0;
    flex-wrap: wrap;
}

input {
    width: 65px;
    padding: 8px;
    font-size: 16px;
    text-align: center;
}

button {
    padding: 10px 25px;
    font-size: 16px;
    margin: 10px 5px;
    cursor: pointer;
    border: none;
    border-radius: 5px;
    background: #1769aa;
    color: white;
}

button:hover {
    background: #0d4775;
}

#result {
    margin-top: 20px;
    padding: 15px;
    background: #eef5ff;
    line-height: 1.8;
}

</style>
</head>

<body>

<div class="container">

<h2>System of Three Linear Equations</h2>

<p>Enter the coefficients and constants.</p>

<div id="inputs">

<div class="equation">
<input id="a1" type="number" value="1">x +
<input id="b1" type="number" value="1">y +
<input id="c1" type="number" value="1">z =
<input id="d1" type="number" value="6">
</div>

<div class="equation">
<input id="a2" type="number" value="2">x +
<input id="b2" type="number" value="-1">y +
<input id="c2" type="number" value="1">z =
<input id="d2" type="number" value="3">
</div>

<div class="equation">
<input id="a3" type="number" value="1">x +
<input id="b3" type="number" value="2">y +
<input id="c3" type="number" value="-1">z =
<input id="d3" type="number" value="2">
</div>

</div>

<button onclick="solve()">Solve</button>

<button onclick="resetValues()">Reset</button>

<div id="result">
The results will be displayed here.
</div>

</div>

<script>

// Calculate the determinant of a 3 x 3 matrix

function det(A) {

    return (
        A[0][0] * (A[1][1]*A[2][2] - A[1][2]*A[2][1])
      - A[0][1] * (A[1][0]*A[2][2] - A[1][2]*A[2][0])
      + A[0][2] * (A[1][0]*A[2][1] - A[1][1]*A[2][0])
    );

}


// Solve the system using Cramer's Rule

function solve() {

    let a = [], b = [];

    for (let i = 1; i <= 3; i++) {

        let row = [
            document.getElementById("a"+i).value,
            document.getElementById("b"+i).value,
            document.getElementById("c"+i).value
        ];

        let constant =
            document.getElementById("d"+i).value;

        if (row.some(v => v.trim() === "") ||
            constant.trim() === "") {

            document.getElementById("result").innerHTML =
                "Please enter a number in every field.";

            return;
        }

        let values = row.map(Number);
        let d = Number(constant);

        if (![...values, d].every(Number.isFinite)) {

            document.getElementById("result").innerHTML =
                "Please enter valid numerical values.";

            return;
        }

        a.push(values);
        b.push(d);

    }


    // Calculate determinants

    let D = det(a);

    let Ax = a.map((r,i) => [b[i],r[1],r[2]]);
    let Ay = a.map((r,i) => [r[0],b[i],r[2]]);
    let Az = a.map((r,i) => [r[0],r[1],b[i]]);

    let Dx = det(Ax);
    let Dy = det(Ay);
    let Dz = det(Az);


    let result = document.getElementById("result");

    let eps = 1e-10;


    // Check whether D is zero

    if (Math.abs(D) < eps) {

        if (Math.abs(Dx) < eps &&
            Math.abs(Dy) < eps &&
            Math.abs(Dz) < eps) {

            result.innerHTML =
                "<b>The solution is not unique.</b><br>" +
                "The system may have infinitely many solutions.";

        } else {

            result.innerHTML =
                "<b>No Solution</b><br>" +
                "The system is inconsistent.";

        }

        return;

    }


    // Calculate x, y and z

    let x = Dx / D;
    let y = Dy / D;
    let z = Dz / D;


    // Display the results

    result.innerHTML =

        "<h3>Calculation Results</h3>" +

        "D = " + D + "<br>" +
        "Dx = " + Dx + "<br>" +
        "Dy = " + Dy + "<br>" +
        "Dz = " + Dz + "<hr>" +

        "<b>x = " + x.toFixed(6) + "</b><br>" +
        "<b>y = " + y.toFixed(6) + "</b><br>" +
        "<b>z = " + z.toFixed(6) + "</b>";

}


// Reset all input values

function resetValues() {

    const values = [
        1,1,1,6,
        2,-1,1,3,
        1,2,-1,2
    ];

    let ids = [
        "a1","b1","c1","d1",
        "a2","b2","c2","d2",
        "a3","b3","c3","d3"
    ];

    ids.forEach((id,i) => {

        document.getElementById(id).value = values[i];

    });

    document.getElementById("result").innerHTML =
        "The results will be displayed here.";

}

</script>

</body>
</html>
